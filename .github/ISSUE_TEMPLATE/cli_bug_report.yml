name: CLI bug report
description: Report a reproducible problem in the SDOC command-line interface.
title: "[CLI Bug]: "
labels:
  - bug
  - "area: cli"
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the SDOC CLI. Please remove credentials, private paths, and proprietary document content before submitting this report.
  - type: input
    id: version
    attributes:
      label: SDOC CLI version
      description: Run `sdoc --version` or the equivalent project-local command.
      placeholder: 0.7.6
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation or execution method
      options:
        - Project-local package via npx
        - Globally installed npm package
        - Packaged tarball
        - Repository source or workspace
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Provide the exact command after replacing private paths and values with safe placeholders.
      render: powershell
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps and minimal input
      description: Include the smallest safe `.sdoc`/`.tiptap.json` input, a repository fixture path, or steps that independently reproduce the problem. Do not reference an inaccessible local file as the only fixture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS and version, shell, Node.js version, and npm version when relevant.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Include only the smallest useful output or diagnostic. Remove credentials, personal data, private paths, and proprietary content.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal data, private paths, and proprietary document content from this report.
          required: true
