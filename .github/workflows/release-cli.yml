name: Release CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to package and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-cli-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run licenses:check
      - run: npm run verify:package:cli
      - name: Verify tag matches package version
        if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "v$($pkg.version)"
          if ($tag -ne $expected) {
            throw "Git tag '$tag' does not match package.json version '$expected'."
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdoc-editor-cli
          path: output/*.tgz
          if-no-files-found: error

  publish:
    name: Publish CLI to npm
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdoc-editor-cli
          path: output
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - name: Check whether the CLI version is already published
        id: npm-version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          test -f "output/sdoc-editor-cli-$version.tgz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "sdoc-editor-cli@$version" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish CLI to npm with OIDC
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish "./output/sdoc-editor-cli-${{ steps.npm-version.outputs.version }}.tgz" --access public

  release:
    name: Attach CLI to GitHub Release
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - package
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdoc-editor-cli
          path: output
      - name: Attach CLI package to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Structured Doc Editor ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: output/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
