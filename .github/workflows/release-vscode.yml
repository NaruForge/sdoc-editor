name: Publish VS Code Extension

# Package and publish the VS Code extension for matching v* release tags.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: true
        type: string
      performance_risk_acceptance_reason:
        description: Optional rationale for accepting this run's rich-browser budget misses
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-vscode-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  performance-review:
    name: Rich browser release evidence
    uses: ./.github/workflows/performance-review.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.release_tag || github.ref }}
      risk_acceptance_reason: ${{ inputs.performance_risk_acceptance_reason || '' }}

  publish:
    name: Package and publish VSIX
    needs: performance-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: vscode-marketplace

    steps:
      - name: Require the exact reviewed commit
        shell: pwsh
        env:
          REVIEWED_COMMIT: ${{ needs.performance-review.outputs.commit }}
        run: |
          if ($env:REVIEWED_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw 'Performance review did not provide an exact clean commit; refusing to resolve the release tag again.'
          }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.performance-review.outputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install dependencies
        run: npm ci

      - name: Verify package versions are synchronized
        run: npm run version:check

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tag = '${{ inputs.release_tag || github.ref_name }}'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "v$($pkg.version)"
          if ($tag -ne $expected) {
            Write-Error "Git tag '$tag' does not match package.json version '$expected'."
            exit 1
          }

      - name: Verify Marketplace authorization
        run: npx vsce verify-pat swbaek --azure-credential

      - name: Package and inspect VSIX
        run: npm run verify:package:vscode

      - name: Verify packaged VSIX in Extension Host
        run: npm run verify:package:vscode:host

      - name: Publish VSIX to Visual Studio Marketplace
        run: npx vsce publish --azure-credential --packagePath output/structured-doc-editor-*.vsix --skip-duplicate
