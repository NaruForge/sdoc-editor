name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  advisor-wrapper:
    name: Advisor wrapper contract
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: .\.agents\skills\orchestrate-sdoc-work\tests\invoke-advisor.Tests.ps1
      - name: Test with PowerShell 7
        shell: pwsh
        run: .\.agents\skills\orchestrate-sdoc-work\tests\invoke-advisor.Tests.ps1

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:all
      - run: npm run package
      - run: npm run package:cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix
          path: output/*.vsix
          if-no-files-found: error

  ui:
    name: UI quality (Chromium)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:ui
      - name: Upload UI test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-quality-results
          path: tests/ui/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  cli-package:
    name: CLI package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run package:cli
      - name: Inspect CLI package contents
        run: npm pack --dry-run ./cli
      - name: Install package and run sdoc (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="$(realpath "$(find output -maxdepth 1 -type f -name '*.tgz' -print -quit)")"
          test -n "$package"
          prefix="$RUNNER_TEMP/sdoc-cli"
          npm install --global --prefix "$prefix" "$package"
          "$prefix/bin/sdoc" --version
      - name: Install package and run sdoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem output -Filter 'sdoc-editor-cli-*.tgz')
          if ($packages.Count -ne 1) {
            throw "Expected exactly one CLI package, found $($packages.Count)."
          }
          $prefix = Join-Path $env:RUNNER_TEMP 'sdoc-cli'
          npm install --global --prefix $prefix $packages[0].FullName
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$prefix;$env:PATH"
          sdoc --version
          sdoc.cmd --version
      - name: Create Korean document through PowerShell 7 shim
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = '한글 제목'
          $documentPath = Join-Path $env:RUNNER_TEMP 'sdoc-pwsh-utf8.sdoc'
          sdoc create $documentPath --title $expected --json
          if ($LASTEXITCODE -ne 0) {
            throw "sdoc create failed with exit code $LASTEXITCODE."
          }
          $document = Get-Content -Raw -Encoding utf8 $documentPath |
            ConvertFrom-Json
          $h1 = @($document.doc.content | Where-Object {
            $_.type -eq 'heading' -and $_.attrs.level -eq 1
          })[0]
          $h1Text = (($h1.content | ForEach-Object { $_.text }) -join '')
          if ($document.meta.title -cne $expected -or $h1Text -cne $expected) {
            throw "PowerShell 7 did not preserve the exact UTF-8 title."
          }
      - name: Create Korean document through Windows PowerShell 5.1 shim
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $expected = '한글 제목'
          $documentPath = Join-Path $env:RUNNER_TEMP 'sdoc-windows-powershell-utf8.sdoc'
          sdoc create $documentPath --title $expected --json
          if ($LASTEXITCODE -ne 0) {
            throw "sdoc create failed with exit code $LASTEXITCODE."
          }
          $document = Get-Content -Raw -Encoding utf8 $documentPath |
            ConvertFrom-Json
          $h1 = @($document.doc.content | Where-Object {
            $_.type -eq 'heading' -and $_.attrs.level -eq 1
          })[0]
          $h1Text = (($h1.content | ForEach-Object { $_.text }) -join '')
          if ($document.meta.title -cne $expected -or $h1Text -cne $expected) {
            throw "Windows PowerShell 5.1 did not preserve the exact UTF-8 title."
          }
      - name: Create Korean document through cmd shim
        if: runner.os == 'Windows'
        shell: cmd
        env:
          SDOC_TEST_TITLE: 한글 제목
        run: |
          @echo off
          set "DOCUMENT_PATH=%RUNNER_TEMP%\sdoc-cmd-utf8.sdoc"
          call sdoc.cmd create "%DOCUMENT_PATH%" --title "%SDOC_TEST_TITLE%" --json
          if errorlevel 1 exit /b %errorlevel%
          node -e "const fs=require('node:fs');const doc=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const expected=process.env.SDOC_TEST_TITLE;const h1=doc.doc.content.find(node=>node.type==='heading'&&node.attrs.level===1);const h1Text=(h1?.content??[]).map(node=>node.text??'').join('');if(doc.meta.title!==expected||h1Text!==expected)throw new Error('cmd.exe did not preserve the exact UTF-8 title.');" "%DOCUMENT_PATH%"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-package-${{ matrix.os }}
          path: output/*.tgz
          if-no-files-found: error

  rust:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: tauri-app
      - run: npm ci
      - run: npm run licenses:check
      - run: cargo fmt --manifest-path tauri-app/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path tauri-app/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path tauri-app/Cargo.toml --workspace
